services:
  mysql:
    image: mysql:8.0
    container_name: yoga-studio-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: yoga
      MYSQL_DATABASE: yoga_studio
      MYSQL_USER: yoga
      MYSQL_PASSWORD: yoga
    ports:
      - "3307:3306"
    volumes:
      - yoga_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uyoga", "-pyoga"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: yoga-studio-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
    ports:
      - "8010:8010"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
    container_name: yoga-studio-ui
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  yoga_mysql_data:
